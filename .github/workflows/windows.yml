name: Windows build

# ponytail: cx_Freeze cannot cross-compile, so let GitHub run the Windows part.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install cx_Freeze appJar mutagen pydub requests

      - name: Patch pydub (prevents dos box popups)
        shell: bash
        run: |
          d=$(python -c "import pydub, os; print(os.path.dirname(pydub.__file__))")
          patch "$d/audio_segment.py" patch/audio_segment.patch
          patch "$d/utils.py" patch/utils.patch

      - name: Fetch bundled ffmpeg/ffprobe/fpcalc
        shell: bash
        run: |
          mkdir -p lib
          curl -sL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -j ffmpeg.zip '*/bin/ffmpeg.exe' '*/bin/ffprobe.exe' -d lib
          curl -sL -o fpcalc.zip https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip
          unzip -j fpcalc.zip '*/fpcalc.exe' -d lib

      - run: python setup.py bdist_msi

      - uses: actions/upload-artifact@v5
        with:
          name: music_wizard-msi
          path: dist/*.msi
